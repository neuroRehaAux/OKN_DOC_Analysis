[project]
name = "okn"
version = "1.0.0"
description = "Statistical analysis for the study 'Optokinetic Nystagmus as an Easy Bedside Test in Disorders of Consciousness - A Retrospective Study'"
readme = "README.md"
requires-python = "==3.12.*"
# pinned to the versions the results in the manuscript were produced with
dependencies = [
    "matplotlib==3.10.0",
    "numpy==2.0.1",
    "pandas==2.2.3",
    "pillow==11.1.0",
    "scikit-learn==1.7.2",
    "scipy==1.15.2",
    "statsmodels==0.14.4",
    "tabulate==0.9.0", # used by pandas for DataFrame.to_markdown
]

[tool.uv]
# a collection of scripts, not an installable package
package = false
